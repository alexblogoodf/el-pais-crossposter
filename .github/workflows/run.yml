name: Generate News Banner

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа (или настройте под себя)
  workflow_dispatch:      # Разрешает ручной запуск из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (for CairoSVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py
        env:
          # Если для шрифта Exo2-Black.ttf нужен путь, можно положить его в корень репозитория
          PYTHONUNBUFFERED: '1'

      - name: Check status of generated files
        run: |
          git status
          ls -la banner.jpg
