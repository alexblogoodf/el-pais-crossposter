name: Generate News Banner

on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа
  workflow_dispatch:      # Разрешает ручной запуск из вкладки Actions

# Разрешаем workflow пушить изменения обратно в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (for CairoSVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and Push banner
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add banner.jpg
          # Коммитим только если файл изменился (игнорируем ошибку, если изменений нет)
          git commit -m "Update news banner [skip ci]" || echo "No changes to commit"
          git push
