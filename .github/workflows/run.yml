name: Generate News Twitter

on:
  workflow_dispatch:

concurrency:
  group: el-pais-crossposter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Обязательно для корректной работы git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get update || echo "⚠️ apt-get update таймаут"
          timeout 120 sudo apt-get install -y libcairo2-dev pkg-config libffi-dev || echo "⚠️ apt-get install таймаут"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate banners, commit, and post to Buffer
        run: python main.py generate
        env:
          PYTHONUNBUFFERED: '1'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

      - name: Safety Commit and Push (подстраховка)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git add -A
          if ! git diff --cached --quiet; then
            echo "⚠️ Скрипт не запушил изменения, делаем это вручную..."
            git commit -m "Update queue & banners [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "✅ Все изменения уже были успешно закоммичены и запушены скриптом main.py"
          fi
