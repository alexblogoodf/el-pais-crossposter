name: Generate News Banner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Вся задача максимум 10 минут

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (with timeout)
        run: |
          timeout 120 sudo apt-get update || echo "⚠️ apt-get update таймаут, продолжаем"
          timeout 120 sudo apt-get install -y libcairo2-dev pkg-config libffi-dev || echo "⚠️ apt-get install таймаут, продолжаем"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py generate
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and Push banners
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update banner & queue [skip ci]" || echo "No changes to commit"
          git push

      - name: Post to Buffer (X/Twitter)
        run: python main.py post
        env:
          PYTHONUNBUFFERED: '1'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

      - name: Commit history update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update post history [skip ci]" || echo "No changes to commit"
          git push
