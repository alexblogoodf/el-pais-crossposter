name: El Pais Crossposter

on:
  schedule:
    - cron: '0 * * * *'  # Запуск каждый час
  workflow_dispatch:      # Кнопка ручного запуска на GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (for CairoSVG)
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run main script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
      run: |
        python main.py

    - name: Commit state changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add state.json
        git diff --staged --quiet || git commit -m "Update state.json [skip ci]"
        git push
