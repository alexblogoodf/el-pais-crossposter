name: Generate News Queue

on:
  workflow_dispatch:

concurrency:
  group: el-pais-crossposter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Увеличен, т.к. теперь может генерить много баннеров

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          timeout 120 sudo apt-get update || echo "⚠️ apt-get update таймаут"
          timeout 120 sudo apt-get install -y libcairo2-dev pkg-config libffi-dev || echo "⚠️ apt-get install таймаут"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run queue generator
        run: python main.py generate
        env:
          PYTHONUNBUFFERED: '1'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update queue & banners [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "Нет изменений для коммита."
          fi
