name: Banners to Instagram

on:
  schedule:
    - cron: '0 * * * *'   # Каждый час
  workflow_dispatch:       # Ручной запуск

jobs:
  crosspost:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачиваем код (вместе с папкой banners)
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем зависимости
        run: pip install requests beautifulsoup4

      - name: Запускаем проверку баннеров и постинг
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python instagram_poster.py

      - name: Сохраняем историю (если были новые посты)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ig_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update IG history [skip ci]" && git pull --rebase && git push)
