name: Instagram News (Buffer)

on:
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:          # ручной запуск для проверки

jobs:
  post-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # чтобы коммитить историю обратно

    steps:
      - name: Скачиваем репозиторий (с папкой banners)
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Устанавливаем зависимости
        run: pip install requests beautifulsoup4

      - name: Публикуем одну новость в Instagram
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python post_instagram_news.py

      - name: Сохраняем историю
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_posted_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram history [skip ci]"
            git pull --rebase --autostash || true
            git push
          else
            echo "История не изменилась — коммит не нужен."
          fi
